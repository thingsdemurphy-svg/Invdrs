<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>Space Invaders</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
</style>
</head>
<body>
<canvas id="game"></canvas> 

<script>
(() => {
  "use strict"; 

  // =====================================================
  // Canvas & layout
  // =====================================================
  const cv = document.getElementById("game");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, FW = 0, OX = 0, u = 1;   // FW = playfield width, OX = playfield x-offset
  let pw = 0, ph = 0, py = 0, invW = 0, invH = 0; 

  // =====================================================
  // Sprites (2 animation frames per invader type)
  // =====================================================
  const INVADER_PATTERNS = [
    [ // Squid – 30 pts
      ["...##...", "..####..", ".######.", "##.##.##", "########", "..#..#..", ".#.##.#.", "#.#..#.#"],
      ["...##...", "..####..", ".######.", "##.##.##", "########", ".#.##.#.", "#......#", ".#....#."]
    ],
    [ // Crab – 20 pts
      ["..#.....#..", "...#...#...", "..#######..", ".##.###.##.", "###########", "#.#######.#", "#.#.....#.#", "...##.##..."],
      ["..#.....#..", "#..#...#..#", "#.#######.#", "###.###.###", "###########", ".#########.", "..#.....#..", ".#.......#."]
    ],
    [ // Octopus – 10 pts
      ["....####....", ".##########.", "############", "###..##..###", "############", "...##..##...", "..##.##.##..", "##........##"],
      ["....####....", ".##########.", "############", "###..##..###", "############", "..###..###..", ".##..##..##.", "..##....##.."]
    ]
  ];
  const PLAYER_PATTERN = ["......#......", ".....###.....", ".....###.....", ".###########.", "#############", "#############", "#############"];
  const UFO_PATTERN = [".....######.....", "...##########...", "..############..", ".##.##.##.##.##.", "################", "..###..##..###..", "...#........#..."];
  const COLORS = ["#ff50c8", "#50dcff", "#8cff78"];
  const POINTS = [30, 20, 10]; 

  function makeSprite(pattern, color) {
    const c = document.createElement("canvas");
    c.width = pattern[0].length; c.height = pattern.length;
    const g = c.getContext("2d");
    g.fillStyle = color;
    pattern.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === "#") g.fillRect(x, y, 1, 1); }));
    return c;
  }
  const invSprites = INVADER_PATTERNS.map((frames, i) => frames.map(f => makeSprite(f, COLORS[i])));
  const playerSprite = makeSprite(PLAYER_PATTERN, "#40ff60");
  const ufoSprite = makeSprite(UFO_PATTERN, "#ff4040"); 

  // =====================================================
  // Sound (Web Audio, no files)
  // =====================================================
  let actx = null;
  function initAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === "suspended") actx.resume();
  }
  function beep(freq, dur, type = "square", vol = 0.08, slide = 0) {
    if (!actx) return;
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur);
  }
  const MARCH_NOTES = [110, 98, 87, 82];
  let marchIdx = 0; 

  // =====================================================
  // Game state
  // =====================================================
  let state = "ready";           // ready | playing | over
  let overTimer = 0;
  let paused = false;
  let score = 0, lives = 3, level = 1;
  let hi = parseInt(localStorage.getItem("si_hi") || "0", 10); 

  let px = 0, fireCd = 0, invuln = 0;
  let pBullets = [], eBullets = [], invaders = [], shields = [], booms = [];
  let dir = 1, invSpeed = 0, total = 55, frame = 0, animT = 0, eFire = 1.5;
  const ufo = { on: false, x: 0, dir: 1, t: 15 };
  const stars = Array.from({ length: 90 }, () => [Math.random(), Math.random(), Math.random()]); 

  // Input
  let touching = false, targetX = 0;
  const keys = { left: false, right: false, fire: false }; 

  // =====================================================
  // Layout / resize
  // ==============
